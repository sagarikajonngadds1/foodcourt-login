<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Court Login</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('foodlogo.jpg') no-repeat center center/cover;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(32, 14, 14, 0.9); /* Slight transparency */
      padding: 30px;
      margin-right: 150px; 
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 400px;
    }

    h2 {
      color: #ff5722;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .forgot-password {
        margin-top: 15px; /* Adds space between password field and Forgot Password */
        font-size: 14px;
        color: #808080; /* Ash gray color */
        text-align: left;
    }


    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #ff5722;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 15px;
    }

    button:hover {
      background: #e64a19;
    }

    .oauth-buttons {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .oauth-buttons button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #ccc;
      color: #000;
      font-weight: bold;
      padding: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .oauth-buttons button img {
      width: 20px;
      margin-right: 10px;
    }

    .oauth-buttons button:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form onsubmit="return validateLogin()">
      <div class="input-group">
        <input type="text" id="username" placeholder="Enter Username" required>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>
       <p class="forgot-password"><a href="#">Forgot Password?</a></p>
      <button type="submit">Login</button>
    </form>
    <div class="oauth-buttons">
      <button onclick="googleLogin()"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg">Login with Google</button>
      <button onclick="appleLogin()"><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">Login with Apple</button>
    </div>
  </div>

  <script>
    function validateLogin() {
      alert("Login successful (demo)!");
      return false;
    }

    function googleLogin() {
      alert("Redirecting to Google login...");
    }

    function appleLogin() {
      alert("Redirecting to Apple login...");
    }
  </script>
</body>
</html>
