<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Food Court</title>
  <link rel="icon" href="data:,"> <!-- Prevents favicon error -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('background.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 400px;
    }

    h1 {
      color: #ff5722;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #ff5722;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #e64a19;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Food Court 🍽️</h1>
    <p>Your favorite dishes, just a click away!</p>
    <a href="login.html" class="btn">Go to Login</a>
  </div>
</body>
</html>
